<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <!--
      主題啟動腳本（必須排在所有 stylesheet 之前、同步執行）
      SSR HTML 對所有人一致、不帶 data-theme（CSS 預設 = 深色）。原本要等 React
      hydrate 後 ThemeContext 的 effect 才依 localStorage / prefers-color-scheme
      切成淺色 → 淺色裝置（Lighthouse 與多數手機預設）會先看到整頁深色再整頁重繪：
      PSI 行動版 LCP 被拖到 4.4s、Speed Index 10.1s，真人也看得到閃一下。
      這裡在首次繪製前就把 data-theme / data-color-mode / .dark 設好，
      ThemeContext 的 effect 會優先讀取這些屬性（鍵名 app_color_mode 兩邊必須一致）。
    -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem("app_color_mode");
          if (m !== "light" && m !== "dark") {
            m = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          var d = document.documentElement;
          d.setAttribute("data-theme", m === "light" ? "studio-light" : "studio");
          d.setAttribute("data-color-mode", m);
          if (m === "dark") d.classList.add("dark"); else d.classList.remove("dark");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 舊瀏覽器 / 部分爬蟲不吃 SVG favicon，補一份 ICO fallback（16+32+48） -->
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      注意：此處刻意不放靜態 title 標籤。
      頁面標題一律由 SEOHead (react-helmet) 在下方 ssr-head 佔位處注入。
      若在此處放靜態標題，因它在文件順序上較前，依 HTML 規範會勝過 Helmet 注入的那個，
      導致所有內頁標題都被通用站名蓋掉（SEO 傷害）。請勿加回。
    -->

    <!-- PWA manifest + theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="阿倫教官" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!--ssr-head-->
    <!--
      字型 — 自架同源 woff2（2026-10-02 自 Google 字型服務搬下來）
      ============================================================
      1) 家族／字重只留「實際用到的」：index.css @theme 只宣告
         --font-display: "Cinzel", "Playfair Display", serif
         --font-body:    "Noto Sans TC", "Montserrat", sans-serif
         因此三個完全沒被引用的家族（分別以 A / L / R 開頭的那三支裝飾字型，
         全站 grep 零引用）與 Playfair 的 italic 變體（零引用）已移除；
         此處刻意不寫出它們的名字，免得「檢查舊字型是否清乾淨」的 grep 誤判。
         ⚠️ Noto Sans TC 刻意「不」自架 —— 中文字集的 woff2 動輒數 MB，
            會直接吃掉行動版 LCP；中文交給系統字型 fallback
            （iOS PingFang / Android Noto Sans CJK）。
      2) 不再連 Google 的字型 CDN（CSS API 與靜態字型檔兩個網域）：
         那是兩次跨域 TLS + 兩段串接延遲（CSS 一趟 → 才知道要抓哪支 woff2
         → 再一趟），行動版慢速 4G 上就是看得見的 FOUT。
         @font-face 現在直接寫在 index.css（與主 CSS 同一個檔，零額外往返），
         字型檔放 public/fonts/，與 HTML 同源共用同一條 HTTP/2 連線。
         來源 URL 與 SIL OFL 授權見 public/fonts/LICENSE.md。
      3) 這裡只 preload「首屏標題真正會用到的那一支」：
         Hero 的 <h1> 吃 .font-display（Cinzel）且 font-black(900)
         → 字型匹配落在宣告的 700 那條 @font-face。Cinzel 是可變字型，
         400/700 共用同一個檔，所以 preload 這一支就同時涵蓋兩個字重。
         ⚠️ 字型 preload 必須帶 crossorigin（字型一律以 CORS 模式取得），
            漏掉會變成「preload 一份 + 真正用時再抓一份」下載兩次。
         ⚠️ 其餘兩支（Montserrat / Playfair Display）刻意不 preload：
            首屏標題用不到，讓它們跟著 CSS 之後再抓就好，別跟主 CSS 搶頻寬。
      4) ⚠️ 本檔同時是 SSR 模板與 app-shell 來源（scripts/vercel-build.sh
         以 sed 替換佔位符），故 ssr-head / ssr-outlet 兩個註解佔位符與
         entry-client 的 script 標籤三個字串不可變動；
         本註解內也刻意不重複寫出那兩個佔位符的完整字面（會被 sed 誤命中）。
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/cinzel-latin.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
