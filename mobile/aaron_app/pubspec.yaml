name: aaron_app
description: "Aaron coach native app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 狀態管理 + 路由
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # 網路
  dio: ^5.7.0

  # 持久化儲存（JWT token）
  shared_preferences: ^2.3.4

  # UI 工具
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  intl: ^0.20.1

  # 媒體相關（聊天傳圖時會用）
  image_picker: ^1.1.2

  # 渲染後台編輯器吐出的 HTML（課程內容 / 文章內容）
  flutter_html: ^3.0.0-beta.2

  # 開外部連結
  url_launcher: ^6.3.1

  # 聊天 Realtime（跟網頁版共用同一套 broadcast channel）
  supabase_flutter: ^2.8.4

  # FCM 推播（後端 Phase 0 整合好之後生效）
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
